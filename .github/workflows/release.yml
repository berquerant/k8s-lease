name: release

permissions: {}

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    timeout-minutes: 30
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: "false"
      - name: Setup env
        uses: ./.github/actions/setup-env
      - name: Setup go
        uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: Create kind cluster
        uses: ./.github/actions/setup-cluster
        with:
          node_image: '${{ env.KIND_NODE_IMAGE }}'
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Set env
        run: |
          echo "REVISION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VERSION=$(git describe --tags --abbrev=0 --exact-match)" >> $GITHUB_ENV
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_PACKAGE: "github.com/berquerant/k8s-lease/version"
