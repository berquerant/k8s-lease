name: release

permissions: {}

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    permissions:
      contents: read # checkout repository for lint and kind-backed tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup env
        uses: $/.github/actions/setup-env
      - name: Setup go
        uses: $/.github/actions/setup-go
        with:
          cache: false # disable cache for clean pre-release verification
      - name: Create kind cluster
        uses: $/.github/actions/setup-cluster
        with:
          node_image: '${{ env.KIND_NODE_IMAGE }}'
      - name: Lint
        run: make lint
      - name: Test
        run: make test

  release:
    needs: test
    permissions:
      contents: write # create GitHub releases and upload release assets
    uses: berquerant/reusable-workflows/.github/workflows/goreleaser-release.yml@v0.3.0
    with:
      setup-mode: go
      version-package: github.com/berquerant/k8s-lease/version
      timeout-minutes: 15
